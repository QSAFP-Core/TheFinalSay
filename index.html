<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Final Say</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap');

  :root{
    --void-black:  #05060a;   /* page background — deep space black */
    --navy-line:   #23324a;   /* hairline / rule, dimmed to sit against black */
    --ink-pale:    #d9e2f1;   /* mantra + quote text */
    --ink-white:   #f4f7fb;   /* selective quote emphasis */
    --ink-faint:   rgba(217,226,241,0.55);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    height: 100%;
    background: var(--void-black);
  }

  body{
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  /* Sparse starfield — three layers of different star sizes, tile sizes and
     opacity so the field reads as depth (distant/mid/near) rather than a
     flat repeating grid. Fixed so it stays put as the page scrolls. */
  .stars{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .stars span{
    position: absolute;
    inset: 0;
    display: block;
    background-repeat: repeat;
  }

  .stars .far{
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.55), transparent 100%),
      radial-gradient(1px 1px at 37% 62%, rgba(255,255,255,0.4), transparent 100%),
      radial-gradient(1px 1px at 58% 30%, rgba(255,255,255,0.5), transparent 100%),
      radial-gradient(1px 1px at 81% 74%, rgba(255,255,255,0.35), transparent 100%),
      radial-gradient(1px 1px at 24% 88%, rgba(255,255,255,0.45), transparent 100%),
      radial-gradient(1px 1px at 92% 12%, rgba(255,255,255,0.4), transparent 100%);
    background-size: 260px 260px;
    opacity: 0.6;
  }

  .stars .mid{
    background-image:
      radial-gradient(1.4px 1.4px at 20% 40%, rgba(217,226,241,0.7), transparent 100%),
      radial-gradient(1.4px 1.4px at 66% 20%, rgba(217,226,241,0.55), transparent 100%),
      radial-gradient(1.4px 1.4px at 84% 66%, rgba(217,226,241,0.6), transparent 100%),
      radial-gradient(1.4px 1.4px at 45% 85%, rgba(217,226,241,0.5), transparent 100%);
    background-size: 420px 420px;
    opacity: 0.55;
  }

  .stars .near{
    background-image:
      radial-gradient(1.8px 1.8px at 30% 30%, rgba(120,160,220,0.8), transparent 100%),
      radial-gradient(1.8px 1.8px at 70% 55%, rgba(217,226,241,0.75), transparent 100%),
      radial-gradient(1.8px 1.8px at 15% 75%, rgba(120,160,220,0.7), transparent 100%);
    background-size: 640px 640px;
    opacity: 0.5;
  }

  header, main, .quote, footer{
    position: relative;
    z-index: 1;
  }

  header{
    flex: 0 0 auto;
    padding: 2.4rem 1.5rem 2rem;
    border-bottom: 1px solid var(--navy-line);
  }

  .header-inner{
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    min-height: clamp(128px, 18vw, 208px);
  }

  .mantra{
    flex: 1 1 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
    text-align: center;
    letter-spacing: 0.12em;
    color: var(--ink-pale);
  }

  .mantra-en{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.1rem, 2.4vw, 1.85rem);
  }

  .mantra-zh{
    font-family: 'Cormorant Garamond', 'Songti SC', 'Noto Serif SC', serif;
    font-weight: 500;
    letter-spacing: 0.28em;
    font-size: clamp(1.1rem, 2.4vw, 1.85rem);
  }

  .mantra-dnld{
    display: inline-block;
    line-height: 0;
    transition: transform 0.25s ease, filter 0.25s ease;
  }

  .mantra-dnld img{
    height: clamp(28px, 3.4vw, 40px);
    width: auto;
    display: block;
  }

  .mantra-dnld:hover{
    transform: scale(1.06);
    filter: drop-shadow(0 4px 14px rgba(60,140,255,0.45));
  }

  .crest{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    height: clamp(128px, 18vw, 208px);
    width: auto;
    z-index: 2;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.6));
    pointer-events: none;
  }

  @media (max-width: 640px){
    .header-inner{
      flex-direction: column;
      min-height: auto;
      gap: 0.85rem;
    }
    .mantra{ flex: none; }
    .crest{
      position: static;
      transform: none;
      height: 152px;
      order: -1;
    }
  }

  main{
    flex: 1 1 auto;
    display: flex;
    flex-direction: row;
    width: 100%;
  }

  .cover-half{
    flex: 1 1 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.75rem;
    position: relative;
  }

  .cover-half::before{
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 72%;
    height: 72%;
    transform: translate(-50%, -50%);
    filter: blur(48px);
    z-index: 0;
    pointer-events: none;
  }

  .cover-half.en::before{
    background: radial-gradient(closest-side,
                  rgba(140,175,230,0.38) 0%,
                  rgba(90,130,195,0.20) 45%,
                  rgba(90,130,195,0.08) 70%,
                  transparent 85%);
  }

  .cover-half.zh::before{
    background: radial-gradient(closest-side,
                  rgba(230,80,70,0.36) 0%,
                  rgba(210,150,60,0.20) 45%,
                  rgba(210,150,60,0.08) 70%,
                  transparent 85%);
  }

  .cover-half img{
    position: relative;
    z-index: 1;
  }

  .cover-half:first-child{
    border-right: 1px solid var(--navy-line);
  }

  .cover-half img{
    max-width: 100%;
    max-height: 82vh;
    width: auto;
    height: auto;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }

  @media (hover: hover) and (pointer: fine){
    .cover-half img:hover{
      /* magnification increased ~50% over the original 1.1x zoom */
      transform: scale(1.15);
      box-shadow: 0 40px 90px rgba(0,0,0,0.7);
      cursor: zoom-in;
      z-index: 5;
    }
  }

  .cover-label{
    position: absolute;
    bottom: 1.1rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }

  @media (max-width: 760px){
    .cover-half{ padding: 1.1rem 0.6rem; }
    .cover-half img{ max-height: 70vh; }
    .cover-label{ font-size: 0.6rem; letter-spacing: 0.08em; }
  }

  @media (max-width: 420px){
    .cover-half{ padding: 0.7rem 0.35rem; }
    .cover-half img{ max-height: 62vh; }
  }

  .quote{
    border-top: 1px solid var(--navy-line);
    padding: 3.4rem 1.5rem 4rem;
    text-align: center;
  }

  .quote p{
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-weight: 500;
    font-size: clamp(1.05rem, 1.8vw, 1.45rem);
    line-height: 1.6;
    letter-spacing: 0.01em;
    color: var(--ink-pale);
    max-width: 68ch;
    margin: 0 auto;
  }

  .quote .shared-boundary{
    font-weight: 600;
    color: var(--ink-white);
  }

  .quote p::before{ content: "\201C"; }
  .quote p::after{ content: "\201D"; }

  .quote-downloads{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(0.8rem, 3vw, 2.5rem);
    padding: 0 1.5rem 3.6rem;
  }

  .scroll-cue{
    font-size: clamp(1.3rem, 2.6vw, 1.9rem);
    line-height: 1;
    animation: bob 1.8s ease-in-out infinite;
  }

  @keyframes bob{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(6px); }
  }

  .dnld-stack{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.1rem;
  }

  .dnld-stack a{
    display: inline-block;
    line-height: 0;
    transition: transform 0.25s ease, filter 0.25s ease;
  }

  .dnld-stack img{
    height: clamp(34px, 4.6vw, 52px);
    width: auto;
    display: block;
  }

  .dnld-stack a:hover{
    transform: scale(1.06);
    filter: drop-shadow(0 4px 14px rgba(60,140,255,0.45));
  }

  @media (max-width: 480px){
    .quote-downloads{ gap: 1rem; }
  }

  .videos{
    border-top: 1px solid var(--navy-line);
  }

  .video-block{
    border-bottom: 1px solid var(--navy-line);
  }

  .video-label{
    text-align: center;
    padding: 1.6rem 1.5rem 0.9rem;
    font-family: 'Cormorant Garamond', 'Songti SC', 'Noto Serif SC', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.15rem, 2vw, 1.55rem);
    letter-spacing: 0.14em;
    color: var(--ink-pale);
  }

  .video-wrap{
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
  }

  .video-wrap iframe{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .pdf-downloads{
    border-top: 1px solid var(--navy-line);
    padding: 3.2rem 1.5rem 3.6rem;
  }

  .pdf-download-row{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: clamp(1.6rem, 4vw, 3.2rem);
    max-width: 1100px;
    margin: 0 auto;
  }

  .pdf-download-col{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
    flex: 1 1 240px;
    max-width: 280px;
  }

  .pdf-download-col .pdf-dnld-label{
    font-family: 'Cormorant Garamond', 'Songti SC', 'Noto Serif SC', serif;
    font-style: italic;
    font-weight: 500;
    letter-spacing: 0.12em;
    font-size: clamp(1rem, 1.8vw, 1.3rem);
    color: var(--ink-pale);
    text-align: center;
  }

  .pdf-cover-wrap{
    position: relative;
    display: inline-block;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }

  .pdf-cover-wrap img.pdf-cover-img{
    max-width: 100%;
    width: min(260px, 78vw);
    height: auto;
    display: block;
    box-shadow: 0 24px 55px rgba(0,0,0,0.55);
  }

  .pdf-cover-wrap .pdf-overlay-btn{
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    line-height: 0;
    transition: transform 0.25s ease, filter 0.25s ease;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.6));
  }

  .pdf-cover-wrap .pdf-overlay-btn img{
    height: clamp(30px, 4vw, 42px);
    width: auto;
    display: block;
  }

  .pdf-cover-wrap .pdf-overlay-btn:hover{
    transform: translateX(-50%) scale(1.08);
    filter: drop-shadow(0 5px 16px rgba(60,140,255,0.55));
  }

  @media (hover: hover) and (pointer: fine){
    .pdf-cover-wrap:hover{
      transform: scale(1.15);
      box-shadow: 0 32px 70px rgba(0,0,0,0.65);
      cursor: zoom-in;
    }
  }
</style>
</head>
